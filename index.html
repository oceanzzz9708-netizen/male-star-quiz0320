<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>测测你和哪个KPL选手最有缘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @font-face { font-family: 'sys'; src: local('PingFang SC'), local('Microsoft YaHei'), local('sans-serif'); }

  :root {
    --bg: #0a0e1a;
    --card: rgba(20, 28, 58, 0.85);
    --gold: #f5c842;
    --gold2: #ff8c00;
    --accent: #00d4ff;
    --purple: #a855f7;
    --pink: #f472b6;
    --text: #e8eaf0;
    --muted: #8892b0;
  }

  body {
    font-family: 'sys', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 星空背景 */
  .stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(88, 28, 135, 0.3) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(0, 100, 200, 0.2) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 50%);
    z-index: 0;
  }
  .stars::after {
    content: '';
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image:
      radial-gradient(2px 2px at 20px 30px, #eee, transparent),
      radial-gradient(2px 2px at 40px 70px, #fff, transparent),
      radial-gradient(1px 1px at 90px 40px, #ddf, transparent),
      radial-gradient(1px 1px at 130px 80px, #fff, transparent),
      radial-gradient(2px 2px at 160px 30px, #eee, transparent),
      radial-gradient(1px 1px at 200px 60px, #fff, transparent),
      radial-gradient(2px 2px at 250px 20px, #ddf, transparent),
      radial-gradient(1px 1px at 300px 50px, #fff, transparent);
    background-size: 320px 100px;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: 0.5; } 100% { opacity: 1; } }

  .container {
    position: relative; z-index: 1;
    max-width: 480px; margin: 0 auto;
    padding: 20px 16px;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  /* 开始页 */
  .start-page { text-align: center; animation: fadeUp 0.8s ease; }
  .start-page .logo {
    width: 120px; height: 120px;
    background: linear-gradient(135deg, var(--gold), var(--gold2), var(--purple));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    font-size: 52px;
    box-shadow: 0 0 40px rgba(245, 200, 66, 0.4), 0 0 80px rgba(168, 85, 247, 0.2);
    animation: glow 3s ease-in-out infinite alternate;
  }
  @keyframes glow {
    0% { box-shadow: 0 0 40px rgba(245, 200, 66, 0.4), 0 0 80px rgba(168, 85, 247, 0.2); transform: scale(1); }
    100% { box-shadow: 0 0 60px rgba(245, 200, 66, 0.6), 0 0 120px rgba(168, 85, 247, 0.3); transform: scale(1.05); }
  }
  .start-page h1 {
    font-size: 28px; font-weight: 800;
    background: linear-gradient(90deg, var(--gold), var(--accent), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .start-page .subtitle { color: var(--muted); font-size: 15px; margin-bottom: 36px; line-height: 1.6; }

  .btn-start {
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: #0a0e1a; border: none;
    padding: 16px 60px; font-size: 18px; font-weight: 700;
    border-radius: 50px; cursor: pointer;
    box-shadow: 0 4px 24px rgba(245, 200, 66, 0.4);
    transition: all 0.3s ease;
    position: relative; overflow: hidden;
  }
  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 6px 32px rgba(245, 200, 66, 0.5); }
  .btn-start:active { transform: translateY(0); }

  /* 题目页 */
  .quiz-page { display: none; width: 100%; animation: fadeUp 0.5s ease; }
  .progress-bar {
    width: 100%; height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px; margin-bottom: 28px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--accent));
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .question-num { color: var(--gold); font-size: 13px; margin-bottom: 8px; font-weight: 600; }
  .question-text { font-size: 20px; font-weight: 700; margin-bottom: 28px; line-height: 1.5; }

  .options { display: flex; flex-direction: column; gap: 12px; }
  .option-btn {
    background: var(--card);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px 20px;
    color: var(--text); font-size: 16px;
    cursor: pointer; text-align: left;
    transition: all 0.25s ease;
    backdrop-filter: blur(10px);
    line-height: 1.5;
  }
  .option-btn:hover {
    border-color: var(--gold);
    background: rgba(245, 200, 66, 0.1);
    transform: translateX(4px);
  }
  .option-btn:active { transform: scale(0.98); }
  .option-btn .letter {
    display: inline-block;
    width: 26px; height: 26px;
    line-height: 26px; text-align: center;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    font-size: 13px; font-weight: 700;
    margin-right: 12px;
    color: var(--gold);
    transition: all 0.25s;
  }
  .option-btn:hover .letter { background: var(--gold); color: #0a0e1a; }

  /* 结果页 */
  .result-page { display: none; text-align: center; animation: fadeUp 0.8s ease; width: 100%; }
  .result-card {
    background: var(--card);
    border: 1.5px solid rgba(245, 200, 66, 0.2);
    border-radius: 24px;
    padding: 36px 24px;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  }
  .result-label {
    font-size: 13px; color: var(--muted);
    letter-spacing: 4px; text-transform: uppercase;
    margin-bottom: 16px;
  }
  .result-avatar {
    width: 100px; height: 100px;
    border-radius: 50%;
    margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
    background: linear-gradient(135deg, rgba(245, 200, 66, 0.2), rgba(168, 85, 247, 0.2));
    border: 2px solid var(--gold);
    box-shadow: 0 0 30px rgba(245, 200, 66, 0.3);
  }
  .result-name {
    font-size: 28px; font-weight: 800;
    background: linear-gradient(90deg, var(--gold), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }
  .result-role { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .result-desc {
    font-size: 15px; line-height: 1.8;
    color: var(--text); text-align: left;
    margin-bottom: 20px;
    padding: 16px;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
  }
  .result-match {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-bottom: 24px;
    font-size: 14px; color: var(--muted);
  }
  .result-match .score {
    font-size: 36px; font-weight: 800;
    color: var(--gold);
  }

  .btn-restart {
    background: transparent;
    border: 1.5px solid var(--gold);
    color: var(--gold);
    padding: 14px 48px;
    font-size: 16px; font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn-restart:hover { background: rgba(245, 200, 66, 0.1); }

  .share-tip { color: var(--muted); font-size: 12px; margin-top: 16px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<div class="stars"></div>

  <!-- 开始页 -->

      <div class="result-avatar" id="resultAvatar"></div>

      <div class="result-desc" id="resultDesc"></div>

    options: [
      { text: "常规赛MVP，统治整个赛季", type: "talent" },
      { text: "最佳中路，操作拉满全场焦点", type: "wild" },
      { text: "总决赛FMVP，决胜局力挽狂澜", type: "steady" },
      { text: "最佳辅助，默默付出无可替代", type: "warm" }

const results = [
  {
    name: "一诺",
    emoji: "🏹",
    role: "发育路 / 射手",
    team: "AG超玩会",
    types: ["carry", "wild"],
    desc: "你和一诺一样是一个充满激情的人！你们都有着不服输的精神和对胜利的渴望。他赛场上敢打敢拼的风格和你在生活中勇往直前的态度完美契合。你们在一起就像双C组合，注定闪耀全场！"
  },
  {
    name: "Fly",
    emoji: "👑",
    role: "对抗路 / 坦克战士",
    team: "重庆狼队",
    types: ["jungle", "steady"],
    desc: "你和Fly有着一样的王者之心！他是KPL最具传奇色彩的选手之一，从未缺席过任何一个总决赛舞台。他的坚持和稳定和你内心的坚定完美共鸣。你们的缘分就像他的关羽一样，一路驰骋势不可挡！"
  },
  {
    name: "无畏",
    emoji: "🦁",
    role: "打野",
    team: "南京Hero久竞",
    types: ["jungle", "wild"],

  },

    emoji: "🐼",

  },
  {

    role: "发育路 / 射手",

let currentQ = 0;
let scores = { jungle: 0, mid: 0, carry: 0, support: 0, wild: 0, talent: 0, steady: 0, warm: 0 };

function startQuiz() {
  currentQ = 0;
  scores = { jungle: 0, mid: 0, carry: 0, support: 0, wild: 0, talent: 0, steady: 0, warm: 0 };
  document.getElementById('startPage').style.display = 'none';
  document.getElementById('resultPage').style.display = 'none';
  document.getElementById('quizPage').style.display = 'block';
  showQuestion();
}

function showQuestion() {
  const q = questions[currentQ];
  document.getElementById('progressFill').style.width = ((currentQ) / questions.length * 100) + '%';
  document.getElementById('questionNum').textContent = `Q${currentQ + 1} / ${questions.length}`;
  document.getElementById('questionText').textContent = q.text;

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];

  q.options.forEach((opt, i) => {
    const btn = document.createElement('div');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="letter">${letters[i]}</span>${opt.text}`;
    btn.onclick = () => selectOption(opt.type);
    container.appendChild(btn);
  });

  // 重新触发动画
  const quizPage = document.getElementById('quizPage');
  quizPage.style.animation = 'none';
  quizPage.offsetHeight;
  quizPage.style.animation = 'fadeUp 0.4s ease';
}

function selectOption(type) {
  scores[type]++;

  currentQ++;
  if (currentQ < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quizPage').style.display = 'none';
  document.getElementById('resultPage').style.display = 'block';

  // 找到得分最高的类型
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const topType = sorted[0][0];
  const secondType = sorted[1][0];

  // 匹配结果：优先匹配两个类型都一致的，再匹配包含topType的
  let matched = results.find(r => r.types[0] === topType && r.types[1] === secondType)
    || results.find(r => r.types.includes(topType) && r.types.includes(secondType))
    || results.find(r => r.types.includes(topType))
    || results[0];

  // 计算缘分分数
  const totalScore = sorted[0][1] + sorted[1][1];
  const matchScore = Math.min(99, Math.max(75, totalScore * 12 + Math.floor(Math.random() * 8)));

  document.getElementById('resultAvatar').textContent = matched.emoji;
  document.getElementById('resultName').textContent = matched.name;
  document.getElementById('resultRole').textContent = matched.role;
  document.getElementById('resultDesc').textContent = matched.desc;

  // 数字滚动效果
  const scoreEl = document.getElementById('resultScore');
  let cur = 0;
  const target = matchScore;
  const step = Math.ceil(target / 30);
  const timer = setInterval(() => {
    cur += step;
    if (cur >= target) { cur = target; clearInterval(timer); }
    scoreEl.textContent = cur;
  }, 30);

  document.getElementById('progressFill').style.width = '100%';
}

function restartQuiz() {
  document.getElementById('resultPage').style.display = 'none';
  document.getElementById('startPage').style.display = 'block';
  // 重置动画
  const startPage = document.getElementById('startPage');
  startPage.style.animation = 'none';
  startPage.offsetHeight;
  startPage.style.animation = 'fadeUp 0.8s ease';
}
</script>

</body>
</html>
